<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Renan Teles — Analista de Sistemas e Sócio-Diretor na Rica Informática. PHP/Laravel, Flutter, Delphi, AWS. Trajetória, stack e blog técnico." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Renan Teles</title>
    <script>
      // Aplica o tema salvo ANTES do Vue montar, evitando um "flash" do tema errado.
      // O padrão (no atributo data-theme acima) é dark.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
